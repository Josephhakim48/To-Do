<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kingdom Daily Focus</title><style>body{margin:0;padding:6px;background:#191a18}
/* Quiet colour panels separate the three areas. */
#kingdom-focus .group{padding:10px 11px 7px;border-radius:9px;background:#232d24;margin-top:0}
#kingdom-focus .group.office{background:#302820;margin-top:12px}
#kingdom-focus .group.other{background:#222a32;margin-top:12px}
#kingdom-focus .group h2{color:#d6e7ce}
#kingdom-focus .group.office h2{color:#ead3b8}
#kingdom-focus .group.other h2{color:#cadcec}
#kingdom-focus .group .track{background:rgba(235,235,225,.12)}
#kingdom-focus .group .task{border-bottom-color:rgba(235,235,225,.09)}
#kingdom-focus .group .add{color:#d6e7ce}
#kingdom-focus .group.office .add{color:#ead3b8}
#kingdom-focus .group.other .add{color:#cadcec}
#kingdom-focus .group .muted,#kingdom-focus .group .empty,#kingdom-focus .group .task small{color:#c0c0b6}

/* Colour only the section headings, leaving task lists on the base surface. */
#kingdom-focus .group{padding:0;background:transparent;border-radius:0}
#kingdom-focus .group.office,#kingdom-focus .group.other{background:transparent}
#kingdom-focus .group>.row{background:#232d24;border-radius:7px;padding:3px 10px}
#kingdom-focus .group.office>.row{background:#302820}
#kingdom-focus .group.other>.row{background:#222a32}
#kingdom-focus .group .track{background:var(--line)}
#kingdom-focus .group .task{border-bottom-color:#2a2d26}
#kingdom-focus .group .muted,#kingdom-focus .group .empty,#kingdom-focus .group .task small{color:var(--muted)}
</style></head><body><style>
#kingdom-focus{--bg:#191a18;--fg:#eeece5;--muted:#aaa99e;--line:#34372f;--sage:#b4c59d;--gold:#d2b58c;max-width:370px;margin:auto;padding:20px 18px 12px;border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--fg);font:13px/1.5 Arial,sans-serif;color-scheme:dark}#kingdom-focus *{box-sizing:border-box}#kingdom-focus .eyebrow{font-size:10px;letter-spacing:2px;color:var(--sage)}#kingdom-focus h1{font:28px Georgia,serif;margin:7px 0 4px}#kingdom-focus h1 em{font-weight:400;color:var(--gold)}#kingdom-focus .muted{color:var(--muted);font-size:11px}#kingdom-focus .row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}#kingdom-focus h2{font:21px Georgia,serif;margin:0}#kingdom-focus .group{margin-top:20px}#kingdom-focus .track{height:3px;background:var(--line);margin:10px 0 3px;border-radius:5px;overflow:hidden}#kingdom-focus .fill{height:100%;background:var(--sage)}#kingdom-focus .office .fill{background:var(--gold)}#kingdom-focus button,#kingdom-focus input,#kingdom-focus select{font:inherit}#kingdom-focus button{background:#292c25;border:1px solid var(--line);border-radius:7px;color:var(--fg);padding:7px 10px;min-height:34px}#kingdom-focus button:hover{background:#373a31}#kingdom-focus button:focus-visible,#kingdom-focus summary:focus-visible,#kingdom-focus input:focus-visible,#kingdom-focus select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}#kingdom-focus .add{border:0;background:transparent;color:var(--muted);font-size:12px}#kingdom-focus .task{display:grid;grid-template-columns:1fr 28px;gap:4px;padding:10px 0;border-bottom:1px solid #2a2d26}#kingdom-focus .task label{display:flex;gap:10px;align-items:flex-start;min-width:0}#kingdom-focus input[type=checkbox]{accent-color:var(--sage);width:17px;height:17px;flex-shrink:0;margin:3px 0 0}#kingdom-focus .task-text{overflow-wrap:anywhere}#kingdom-focus .task small{display:block;color:var(--muted);font-size:11px;margin-top:2px}#kingdom-focus .task.done .task-text{text-decoration:line-through;color:var(--muted)}#kingdom-focus .delete{background:transparent;border:0;padding:0;color:var(--muted);min-height:30px}#kingdom-focus .next{margin-top:20px;border-radius:10px;padding:13px;background:#252b22}#kingdom-focus .next-title{font-size:10px;letter-spacing:1.5px;color:var(--sage);margin-bottom:6px}#kingdom-focus #next-name{font:17px/1.35 Georgia,serif;overflow-wrap:anywhere}#kingdom-focus details{margin-top:12px}#kingdom-focus summary{font-size:11px;color:var(--muted);padding:6px 0}#kingdom-focus form{display:grid;gap:8px;margin:10px 0;padding:12px;background:#22251f;border-radius:8px}#kingdom-focus form label{font-size:11px;color:var(--muted);display:grid;gap:3px}#kingdom-focus input:not([type=checkbox]),#kingdom-focus select{width:100%;min-width:0;padding:8px;background:#181b16;border:1px solid #45483e;color:var(--fg);border-radius:5px}#kingdom-focus .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}#kingdom-focus .tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}#kingdom-focus .empty{color:var(--muted);font-size:12px;padding:12px 0}#kingdom-focus #message{color:var(--gold);font-size:11px;margin:8px 0 0}#kingdom-focus #message:empty{display:none}#kingdom-focus [hidden]{display:none!important}#kingdom-focus .preview-label{font-size:10px;color:var(--muted)}@media(max-width:280px){#kingdom-focus{padding:14px 10px}#kingdom-focus .fields{grid-template-columns:1fr}}@media(pointer:coarse){#kingdom-focus button{min-height:44px}#kingdom-focus input:not([type=checkbox]),#kingdom-focus select{font-size:16px}}

#kingdom-focus{padding:12px 14px;max-width:330px;border-radius:12px}
#kingdom-focus .group{margin-top:0}
#kingdom-focus .group.office{margin-top:14px}
#kingdom-focus h2{font:17px Georgia,serif}
#kingdom-focus .add{min-width:32px;min-height:32px;padding:0;font-size:20px}
#kingdom-focus .track{margin:4px 0 2px;height:2px}
#kingdom-focus .task{padding:7px 0;grid-template-columns:1fr 22px}
#kingdom-focus .task label{align-items:center;gap:8px}
#kingdom-focus .task-text{font-size:12px;flex:1}
#kingdom-focus .task small{display:inline;margin-left:7px;font-size:11px;white-space:nowrap}
#kingdom-focus .carry{font-size:11px;color:var(--muted)}
#kingdom-focus .delete{font-size:14px;min-height:26px}
#kingdom-focus .next{margin-top:12px;padding:9px 10px;display:flex;align-items:baseline;gap:5px 8px;flex-wrap:wrap;border-radius:6px}
#kingdom-focus .next-title{font-size:11px;letter-spacing:0;margin:0;white-space:nowrap}
#kingdom-focus #next-name{font:12px/1.4 Arial,sans-serif;flex:1;min-width:110px}
#kingdom-focus #next-meta{font-size:11px}
#kingdom-focus details{margin-top:6px}
#kingdom-focus #demo{display:none}
#kingdom-focus .empty{padding:8px 0}
@media(pointer:coarse){#kingdom-focus .add,#kingdom-focus .delete{min-height:44px}#kingdom-focus .task label{min-height:44px}}

#kingdom-focus{--sage:#8bd2a4}
#kingdom-focus .task.done{grid-template-columns:1fr auto}
#kingdom-focus .task.done .task-text{color:#8bd2a4;text-decoration:none}
#kingdom-focus .task.done small{color:#9cbea7}
#kingdom-focus #done-count{color:#8bd2a4}
#kingdom-focus .reopen{color:#a9e3bb;border:1px solid #3d674a;background:#203427;font-size:11px;padding:4px 8px;min-height:32px}
#kingdom-focus .office .fill{background:var(--sage)}
#kingdom-focus h2{display:flex;align-items:center;gap:7px;overflow-wrap:anywhere;max-width:220px}#kingdom-focus .section-icon{width:20px;height:20px;object-fit:contain;flex-shrink:0;font:18px/20px Arial}#kingdom-focus .custom-section{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}#kingdom-focus .custom-section label{font-size:11px;color:var(--muted)}
#kingdom-focus .group.other{margin-top:14px}</style>
<main id="kingdom-focus">
<span id="demo" hidden></span><span id="date" hidden></span>
<section class="group"><div class="row"><div class="row"><h2 id="mine-heading"></h2><span id="mine-count" class="muted"></span></div><button type="button" class="add cursor-interaction" data-add="mine" aria-label="Add mine task">+</button></div><div class="track"><div class="fill" id="mine-fill"></div></div><div id="mine-list"></div></section>
<section class="group office"><div class="row"><div class="row"><h2 id="office-heading"></h2><span id="office-count" class="muted"></span></div><button type="button" class="add cursor-interaction" data-add="office" aria-label="Add office task">+</button></div><div class="track"><div class="fill" id="office-fill"></div></div><div id="office-list"></div></section>
<form id="task-form" hidden><label>Task<input id="task-name" maxlength="180" required placeholder="One clear next action"></label><div class="fields"><label>Area<select id="task-area"><option value="mine">Personal</option><option value="study">Trading study</option><option value="office">Office</option><option value="other">Other</option></select></label><label>Minutes (estimate)<input id="task-minutes" type="number" min="5" max="720" step="5" value="30" required></label></div><label>Planned date<input id="task-date" type="date" required></label><div class="tools"><button type="submit">Add task</button><button id="cancel" type="button">Cancel</button></div></form>
<details id="done-panel" hidden><summary id="done-count">Done · 0</summary><div id="done-list"></div></details><section class="group other"><div class="row"><div class="row"><h2 id="other-heading"></h2><span id="other-count" class="muted"></span></div><button type="button" class="add cursor-interaction" data-add="other" aria-label="Add other task">+</button></div><div class="track"><div class="fill" id="other-fill"></div></div><div id="other-list"></div></section>
<div id="message" role="status" aria-live="polite"></div><button id="undo" type="button" hidden>Undo removal</button>
<details><summary class="cursor-interaction">Settings</summary><details><summary>Section names & icons</summary><div class="custom-section"><label for="mine-name">Mine section name</label><input id="mine-name" maxlength="32" placeholder="Section name"><label for="mine-emoji">Emoji / symbol</label><input id="mine-emoji" maxlength="16" placeholder="Paste an emoji"><div class="tools"><button type="button" id="mine-upload">Upload icon</button><button type="button" id="mine-clear">No icon</button></div><input type="file" id="mine-icon-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></div><div class="custom-section"><label for="office-name">Office work section name</label><input id="office-name" maxlength="32" placeholder="Section name"><label for="office-emoji">Emoji / symbol</label><input id="office-emoji" maxlength="16" placeholder="Paste an emoji"><div class="tools"><button type="button" id="office-upload">Upload icon</button><button type="button" id="office-clear">No icon</button></div><input type="file" id="office-icon-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></div><div class="custom-section"><label for="other-name">Other section name</label><input id="other-name" maxlength="32" placeholder="Section name"><label for="other-emoji">Emoji / symbol</label><input id="other-emoji" maxlength="16" placeholder="Paste an emoji"><div class="tools"><button type="button" id="other-upload">Upload icon</button><button type="button" id="other-clear">No icon</button></div><input type="file" id="other-icon-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></div></details><p class="muted">Today includes unfinished earlier tasks. Completed tasks stay in history. Estimates describe workload, not time saved.</p><div id="history"></div><div class="tools"><button id="export" type="button">Backup</button><button id="import" type="button">Restore</button><input id="file" type="file" accept=".json,application/json" hidden></div><p class="muted">Saved in this browser only. Not synced to Notion or your study-progress widget. Africa/Juba time.</p></details>
</main>
<script>
(()=>{'use strict';const PREVIEW=false;const root=document.getElementById('kingdom-focus'),$=id=>root.querySelector('#'+id),KEY='kingdom-focus-v1';
function today(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Juba',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(p=>[p.type,p.value]));return `${p.year}-${p.month}-${p.day}`;}
function validDate(d){return typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&Number.isFinite(Date.parse(d))&&new Date(d+'T00:00:00Z').toISOString().slice(0,10)===d;}
function defaultSections(){return {mine:{name:'Mine',emoji:'🌿',image:''},office:{name:'Office work',emoji:'💼',image:''},other:{name:'Other',emoji:'📌',image:''}};}
function sectionConfig(value){const result=defaultSections();if(value===undefined)return result;for(const key of ['mine','office','other']){const v=value&&value[key];if(key==='other'&&v===undefined)continue;if(!v||typeof v.name!=='string'||!v.name.trim()||v.name.length>32||typeof v.emoji!=='string'||v.emoji.length>16||typeof v.image!=='string'||v.image.length>40000||(v.image&&!/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(v.image)))throw Error('Invalid section settings.');result[key]={name:v.name.trim(),emoji:v.emoji,image:v.image};}return result;}
function validate(s){if(!s||s.version!==1||!Array.isArray(s.tasks)||s.tasks.length>10000)throw Error('Choose a Kingdom Focus backup.');const ids=new Set;for(const t of s.tasks){if(!t||typeof t.id!=='string'||t.id.length>100||ids.has(t.id)||typeof t.name!=='string'||!t.name.trim()||t.name.length>180||!['mine','study','office','other'].includes(t.area)||!validDate(t.date)||typeof t.done!=='boolean'||!Number.isInteger(t.minutes)||t.minutes<5||t.minutes>720)throw Error('Invalid task in backup.');ids.add(t.id);}return {version:1,sections:sectionConfig(s.sections),tasks:s.tasks.map(t=>({id:t.id,name:t.name,area:t.area,date:t.date,done:t.done,minutes:t.minutes}))};}
let state={version:1,sections:defaultSections(),tasks:[]},canSave=true,removed=null;
function notify(m){$('message').textContent=m+(PREVIEW?' · Preview only.':!canSave?' · Browser saving unavailable; use Backup.':'');}
if(PREVIEW){state.tasks=[['Trading Fanatics lesson','study',60],['Read a few pages','mine',20],['Check site quantities','office',45],['Prepare site report','office',60],['Organise saved links','other',10]].map((x,i)=>({id:String(i),name:x[0],area:x[1],minutes:x[2],date:today(),done:false}));$('demo').hidden=false;}else{try{const raw=localStorage.getItem(KEY);if(raw)state=validate(JSON.parse(raw));}catch(e){canSave=false;notify('Saved data could not be accessed.');}}
function save(){if(!PREVIEW&&canSave){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){canSave=false;notify('Changes are in memory only.');}}}
function node(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function taskRow(t){const row=node('div','task'+(t.done?' done':'')),label=node('label'),check=node('input');check.type='checkbox';check.checked=t.done;check.setAttribute('aria-label','Complete '+t.name);check.onchange=()=>{t.done=check.checked;save();render();notify(t.done?'Task completed.':'Task reopened.');};const body=node('span','task-text',t.name);body.append(node('small','',t.minutes+'m'));if(t.date<today()&&!t.done)body.append(node('span','carry',' · carried over'));label.append(check,body);const del=node('button','delete cursor-interaction','×');del.type='button';del.setAttribute('aria-label','Remove '+t.name);del.onclick=()=>{removed=t;state.tasks=state.tasks.filter(x=>x.id!==t.id);save();render();$('undo').hidden=false;notify('Task removed.');};if(t.done){const undo=node('button','reopen cursor-interaction','Undo');undo.type='button';undo.setAttribute('aria-label','Undo completion of '+t.name);undo.onclick=()=>{t.done=false;save();render();notify('Task returned to your checklist.');};row.append(label,undo);}else{row.append(label,del);}return row;}
function render(){renderSections();const date=today();$('date').textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Juba',weekday:'long',day:'numeric',month:'long'}).format(new Date());const visible=state.tasks.filter(t=>t.date===date||t.date<date&&!t.done);for(const group of ['mine','office','other']){const list=visible.filter(t=>group==='mine'?(t.area==='mine'||t.area==='study'):t.area===group);const completed=list.filter(t=>t.done).length;$(group+'-count').textContent=completed+' / '+list.length;$(group+'-fill').style.width=(list.length?completed/list.length*100:0)+'%';const container=$(group+'-list');container.replaceChildren();list.filter(t=>!t.done).forEach(t=>container.append(taskRow(t)));if(!list.length)container.append(node('div','empty',group==='mine'?'Choose one meaningful thing for today.':group==='office'?'Add today’s office priorities.':'Small tasks for when you have a moment.'));}const done=visible.filter(t=>t.done);$('done-list').replaceChildren();done.forEach(t=>$('done-list').append(taskRow(t)));$('done-panel').hidden=!done.length;$('done-count').textContent='Done · '+done.length;const history=$('history');history.replaceChildren();const other=state.tasks.filter(t=>t.date>date||t.date<date&&t.done).sort((a,b)=>b.date.localeCompare(a.date));other.forEach(t=>history.append(taskRow(t)));if(!other.length)history.append(node('p','muted','No future or past completed tasks yet.'));}
root.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{$('task-form').hidden=false;$('task-area').value=b.dataset.add;$('task-date').value=today();$('task-name').focus();});$('cancel').onclick=()=>{$('task-form').hidden=true;};$('task-form').onsubmit=e=>{e.preventDefault();try{const task={id:crypto.randomUUID(),name:$('task-name').value.trim(),area:$('task-area').value,date:$('task-date').value,minutes:Number($('task-minutes').value),done:false};state=validate({version:1,sections:state.sections,tasks:[...state.tasks,task]});save();$('task-form').reset();$('task-form').hidden=true;render();notify('Task added.');}catch(e){notify(e.message);}};
$('undo').onclick=()=>{if(removed&&!state.tasks.some(t=>t.id===removed.id)){state.tasks.push(removed);save();render();}removed=null;$('undo').hidden=true;notify('Task restored.');};
$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=node('a');a.href=url;a.download='kingdom-focus-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);notify('Backup prepared.');};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const f=$('file').files[0];if(!f)return;if(f.size>4000000)throw Error('Backup too large.');const imported=validate(JSON.parse(await f.text()));const known=new Set(state.tasks.map(t=>t.id));state=validate({version:1,sections:imported.sections,tasks:[...state.tasks,...imported.tasks.filter(t=>!known.has(t.id))]});save();render();syncFields();notify('Backup merged; section settings restored.');}catch(e){notify('Restore failed: '+e.message);}finally{$('file').value='';}};

function renderSections(){for(const g of ['mine','office','other']){const config=state.sections[g],h=$(g+'-heading');h.replaceChildren();if(config.image){const img=node('img','section-icon');img.src=config.image;img.alt='';h.append(img);}else if(config.emoji){const icon=node('span','section-icon',config.emoji);icon.setAttribute('aria-hidden','true');h.append(icon);}h.append(node('span','',config.name));}const options=$('task-area').options;options[0].textContent=state.sections.mine.name;options[2].textContent=state.sections.office.name;options[3].textContent=state.sections.other.name;root.querySelectorAll('[data-add]').forEach(b=>b.setAttribute('aria-label','Add task to '+state.sections[b.dataset.add].name));}
function syncFields(){for(const g of ['mine','office','other']){$(g+'-name').value=state.sections[g].name;$(g+'-emoji').value=state.sections[g].emoji;}}
for(const g of ['mine','office','other']){$(g+'-name').onchange=()=>{const name=$(g+'-name').value.trim();if(!name){$(g+'-name').value=state.sections[g].name;notify('Enter a section name.');return;}state.sections[g].name=name.slice(0,32);save();render();notify('Section renamed.');};$(g+'-emoji').onchange=()=>{state.sections[g].emoji=$(g+'-emoji').value.slice(0,16);state.sections[g].image='';save();render();notify('Emoji updated.');};$(g+'-clear').onclick=()=>{state.sections[g].emoji='';state.sections[g].image='';syncFields();save();render();notify('Icon removed.');};$(g+'-upload').onclick=()=>$(g+'-icon-file').click();$(g+'-icon-file').onchange=()=>{const input=$(g+'-icon-file'),file=input.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)||file.size>2*1024*1024){notify('Choose a PNG, JPG, WebP or GIF under 2 MB.');input.value='';return;}const reader=new FileReader();reader.onerror=()=>notify('Could not read the icon.');reader.onload=()=>{const img=new Image();img.onerror=()=>notify('Could not open this image.');img.onload=()=>{try{if(img.width>8000||img.height>8000)throw Error('Use an image smaller than 8000 pixels.');const canvas=document.createElement('canvas');const ratio=Math.min(1,64/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/png');if(data.length>40000)throw Error('Please use a simpler icon.');state.sections[g].image=data;state.sections[g].emoji='';syncFields();save();render();notify('Icon uploaded.');}catch(e){notify(e.message);}};img.src=reader.result;};reader.readAsDataURL(file);input.value='';};}
syncFields();
render();let last=today();setInterval(()=>{if(today()!==last){last=today();render();}},30000);if(typeof globalThis.__focusTest==='function')globalThis.__focusTest({validate,today,getState:()=>state});})();
</script>
</body></html>
